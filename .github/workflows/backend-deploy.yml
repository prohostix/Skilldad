name: Backend Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: cd server && npm install



      # Note: Actual deployment step depends on the specific AWS service (EC2, App Runner, etc.)
      # This is a placeholder for AWS App Runner deployment
      - name: Deploy to EC2 via SSH
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.234.186.48
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/skilldad
            # Force update codebase
            git fetch origin main
            git reset --hard origin/main
            
            # Install production dependencies
            cd server
            npm install --production
            
            # Ensure certificates/RDS setup is intact
            # PM2 Manage
            pm2 restart skilldad-backend || pm2 start server.js --name skilldad-backend
            pm2 save
            
            echo "Deployment to 13.233.85.18 successful!"
